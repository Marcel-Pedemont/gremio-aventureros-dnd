<!DOCTYPE html>
<html lang="es" data-theme="cyberpunk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&M The Danger Master-Mont</title>
    
    <!-- Fuentes Gamer / Futuristas desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Orbitron:wght@500;800&family=Press+Start+2P&family=Rajdhani:wght@600;700&family=Teko:wght@600&display=swap" rel="stylesheet">
    
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos CSS (Carga Directa) -->
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

   <header class="global-header">
    <div class="logo-brand">
        <span class="brand-title">D&M</span>
    </div>
    
    <!-- Título Central Agregado -->
    <div class="header-center-title">
        GREMIO AVENTUREROS D&D
    </div>

    <div class="theme-picker-container">
        <label for="theme-select"><i class="fas fa-palette"></i> ESTILO:</label>
        <select id="theme-select" class="theme-dropdown">
            <option value="cyberpunk">⚡ Cyberpunk 2077</option>
            <option value="synthwave">🌆 Synthwave Retro</option>
            <option value="rgb-gamer">🟢 RGB Gamer Pro</option>
            <option value="void-arcane">🔮 Void Arcane</option>
            <option value="blood-crimson">🩸 Blood Crimson</option>
        </select>
    </div>
</header>

    <main>
        <section id="hero-landing" class="hero-section">
            <div class="hero-content">
                <div class="avatar-frame">
                    <img src="assets/danger-master-avatar.png" alt="The Danger Master-Mont" class="dm-avatar-img" onerror="this.src='https://via.placeholder.com/220/121212/00f3ff?text=D%26M+Master'">
                </div>

                <h1 class="hero-title">D&M</h1>
                <h2 class="hero-subtitle">THE DANGER MASTER-MONT</h2>
                <p class="hero-tagline">Entra al Multiverso de Rol Neofuturista</p>

                <button id="btn-enter-multiverse" class="btn-hero-glow">
                    <i class="fas fa-gamepad"></i> INICIAR TU AVENTURA
                </button>
            </div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
